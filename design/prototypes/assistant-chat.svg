  <text x="52" y="336" fill="#17315C" font-size="16" font-family="Arial">并建议创建 3 个提醒。请确认是否生成行程草案。</text>

  <rect x="32" y="398" width="366" height="180" rx="26" fill="#F1F7F7" stroke="#D3E7E3"/>
