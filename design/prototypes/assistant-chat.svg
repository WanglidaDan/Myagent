<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="430" height="932" rx="44" fill="#EEF2F5"/>
  <rect x="18" y="18" width="394" height="896" rx="36" fill="#F8FAFB" stroke="#D7DEE6"/>
