  <rect x="194" y="530" width="128" height="36" rx="18" fill="#FFFFFF"/>
  <text x="230" y="553" fill="#17315C" font-size="14" font-family="Arial">继续修改</text>

  <text x="32" y="626" fill="#17315C" font-size="18" font-family="Arial" font-weight="700">快捷指令</text>
  <rect x="32" y="646" width="174" height="54" rx="20" fill="#FFFFFF" stroke="#DFE6EC"/>
  <text x="50" y="678" fill="#17315C" font-size="14" font-family="Arial">创建明天提醒</text>
  <rect x="224" y="646" width="174" height="54" rx="20" fill="#FFFFFF" stroke="#DFE6EC"/>
  <text x="242" y="678" fill="#17315C" font-size="14" font-family="Arial">扫描发票并入账</text>
  <rect x="32" y="712" width="174" height="54" rx="20" fill="#FFFFFF" stroke="#DFE6EC"/>
  <text x="50" y="744" fill="#17315C" font-size="14" font-family="Arial">为会议规划路线</text>
  <rect x="224" y="712" width="174" height="54" rx="20" fill="#FFFFFF" stroke="#DFE6EC"/>
  <text x="242" y="744" fill="#17315C" font-size="14" font-family="Arial">整理本月报销</text>

  <rect x="32" y="808" width="366" height="72" rx="24" fill="#FFFFFF" stroke="#D7DEE6"/>
  <text x="56" y="852" fill="#9AA4B6" font-size="15" font-family="Arial">输入日程、提醒、出差或发票相关需求...</text>
